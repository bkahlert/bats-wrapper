name: test-report

on:
  workflow_run:
    workflows: ['build']
    types: ['completed']

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped'
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: dorny/test-reporter@v3.0.0
        with:
          artifact: test-reports
          name: Bats tests
          path: '*.xml'
          reporter: java-junit
