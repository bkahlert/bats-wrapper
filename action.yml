name: 'Bats Wrapper'
author: 'Björn Kahlert'
description: 'Run Bats (Bash Automated Testing System) tests'
branding:
  icon: 'check'
  color: 'green'
inputs:
  filter:
    description: 'Only run tests that match the regular expression'
    required: false
  formatter:
    description: >
      Switch between formatters: pretty (default),
      tap (default w/o term), tap13, junit
    required: false
  gather-test-outputs-in:
    description: >
      Gather the output of failing *and* passing tests
      as files in directory
    required: false
  jobs:
    description: 'Number of parallel jobs'
    required: false
  no-tempdir-cleanup:
    description: 'Preserve test output temporary directory'
    required: false
  no-parallelize-across-files:
    description: >
      Serialize test file execution instead of running
      them in parallel (requires --jobs >1)
    required: false
  no-parallelize-within-files:
    description: >
      Serialize test execution within files instead of
      running them in parallel (requires --jobs >1)
    required: false
  report-formatter:
    description: 'Switch between reporters (same options as --formatter)'
    required: false
  output:
    description: 'Directory to write report files'
    required: false
  print-output-on-failure:
    description: 'Automatically print the value of `$output` on failed tests'
    required: false
  recursive:
    description: 'Include tests in subdirectories'
    required: false
  show-output-of-passing-tests:
    description: 'Print output of passing tests'
    required: false
  timing:
    description: 'Add timing information to tests'
    required: false
  trace:
    description: 'Print test commands as they are executed (like `set -x`)'
    required: false
  verbose-run:
    description: 'Make `run` print `$output` by default'
    required: false
  tests:
    description: >
      Path to a Bats test file, or to a directory containing
      Bats test files (ending with ".bats")
    required: true
outputs:
  status:
    description: 'Exit status/code of the test run'
    value: ${{ steps.bats-wrapper.outputs.status }}
  output:
    description: 'Output of the test run'
    value: ${{ steps.bats-wrapper.outputs.output }}
runs:
  using: 'composite'
  steps:
    - name: Run Bats tests
      id: bats-wrapper
      env:
        BATSW_ACTION_PATH: ${{ github.action_path }}
        BATSW_INPUT_TESTS: ${{ inputs.tests }}
        BATSW_INPUT_FILTER: ${{ inputs.filter }}
        BATSW_INPUT_FORMATTER: ${{ inputs.formatter }}
        BATSW_INPUT_GATHER_TEST_OUTPUTS_IN: ${{ inputs.gather-test-outputs-in }}
        BATSW_INPUT_JOBS: ${{ inputs.jobs }}
        BATSW_INPUT_NO_TEMPDIR_CLEANUP: ${{ inputs.no-tempdir-cleanup }}
        BATSW_INPUT_NO_PARALLELIZE_ACROSS_FILES: ${{ inputs.no-parallelize-across-files }}
        BATSW_INPUT_NO_PARALLELIZE_WITHIN_FILES: ${{ inputs.no-parallelize-within-files }}
        BATSW_INPUT_REPORT_FORMATTER: ${{ inputs.report-formatter }}
        BATSW_INPUT_OUTPUT: ${{ inputs.output }}
        BATSW_INPUT_PRINT_OUTPUT_ON_FAILURE: ${{ inputs.print-output-on-failure }}
        BATSW_INPUT_RECURSIVE: ${{ inputs.recursive }}
        BATSW_INPUT_SHOW_OUTPUT_OF_PASSING_TESTS: ${{ inputs.show-output-of-passing-tests }}
        BATSW_INPUT_TIMING: ${{ inputs.timing }}
        BATSW_INPUT_TRACE: ${{ inputs.trace }}
        BATSW_INPUT_VERBOSE_RUN: ${{ inputs.verbose-run }}
      run: |
        set_multiline_output() {
          local name=${1?name missing} && shift
          local value=$*
          local delimiter=BATS_WRAPPER_OUTPUT
          while grep -Fxq "$delimiter" <<<"$value"; do
            delimiter+=_
          done
          {
            printf '%s<<%s\n' "$name" "$delimiter"
            printf '%s\n' "$value"
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
        }

        declare -a input_tests=()
        while IFS= read -r input_test; do
          [ ! "${input_test-}" ] || input_tests+=("$input_test")
        done <<<"$BATSW_INPUT_TESTS"

        declare -a opts=()
        for option in filter formatter gather-test-outputs-in jobs report-formatter output; do
          variable="BATSW_INPUT_${option^^}"
          variable=${variable//-/_}
          [ ! "${!variable}" ] || opts+=("--$option" "${!variable}")
        done
        for option in no-tempdir-cleanup no-parallelize-across-files no-parallelize-within-files \
          print-output-on-failure recursive show-output-of-passing-tests timing trace verbose-run; do
          variable="BATSW_INPUT_${option^^}"
          variable=${variable//-/_}
          case "${!variable}" in
            ''|false) ;;
            *) opts+=("--$option") ;;
          esac
        done

        declare output status
        if output=$(bash "$BATSW_ACTION_PATH/batsw" "${opts[@]}" "${input_tests[@]}"); then
          status=0
        else
          status=$?
        fi
        printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"
        set_multiline_output output "${output-}"
        printf '%s\n' "${output-}"
        exit "$status"
      shell: bash
